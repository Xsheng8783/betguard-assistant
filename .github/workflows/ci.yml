name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python deps
        run: python -m pip install --upgrade pip pytest pillow
      - name: Python audit + core suites
        run: python -m pytest tests/test_sample034_audit.py tests/test_pipeline.py tests/test_column_geometry.py tests/test_deterministic_checks.py tests/test_semantic_parser.py tests/test_vision_closed_set.py tests/test_ab_replay_regression.py -q
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Node ROI tests
        run: node sample-034-debug/review-tool/test_roi_apply.mjs
