[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "betguard-assistant"
version = "0.1.0"
description = "539 / multi-lottery text parser and risk-control assistant."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "betguard-assistant maintainers" }
]
dependencies = [
  "streamlit>=1.36",
  "playwright>=1.45"
]

[project.optional-dependencies]
dev = [
  "pytest>=8"
]

[project.scripts]
betguard = "betguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
