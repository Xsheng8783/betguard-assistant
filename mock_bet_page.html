<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <title>539 二三四星 連碰 Mock Page</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 24px; }
      .numbers { display: grid; grid-template-columns: repeat(10, minmax(44px, 1fr)); gap: 8px; max-width: 560px; }
      button { padding: 8px 10px; }
      button.selected { outline: 3px solid #0f766e; background: #ccfbf1; }
      .amounts { display: grid; grid-template-columns: 80px 160px; gap: 8px; max-width: 260px; margin-top: 24px; }
      .danger { margin-top: 24px; }
    </style>
  </head>
  <body>
    <h1>539 二三四星 連碰 Mock Page</h1>
    <section class="numbers">
      <button type="button" data-number="01">01</button>
      <button type="button" data-number="02">02</button>
      <button type="button" data-number="03">03</button>
      <button type="button" data-number="04">04</button>
      <button type="button" data-number="05">05</button>
      <button type="button" data-number="06">06</button>
      <button type="button" data-number="07">07</button>
      <button type="button" data-number="08">08</button>
      <button type="button" data-number="09">09</button>
      <button type="button" data-number="10">10</button>
      <button type="button" data-number="11">11</button>
      <button type="button" data-number="12">12</button>
      <button type="button" data-number="13">13</button>
      <button type="button" data-number="14">14</button>
      <button type="button" data-number="15">15</button>
      <button type="button" data-number="16">16</button>
      <button type="button" data-number="17">17</button>
      <button type="button" data-number="18">18</button>
      <button type="button" data-number="19">19</button>
      <button type="button" data-number="20">20</button>
      <button type="button" data-number="21">21</button>
      <button type="button" data-number="22">22</button>
      <button type="button" data-number="23">23</button>
      <button type="button" data-number="24">24</button>
      <button type="button" data-number="25">25</button>
      <button type="button" data-number="26">26</button>
      <button type="button" data-number="27">27</button>
      <button type="button" data-number="28">28</button>
      <button type="button" data-number="29">29</button>
      <button type="button" data-number="30">30</button>
      <button type="button" data-number="31">31</button>
      <button type="button" data-number="32">32</button>
      <button type="button" data-number="33">33</button>
      <button type="button" data-number="34">34</button>
      <button type="button" data-number="35">35</button>
      <button type="button" data-number="36">36</button>
      <button type="button" data-number="37">37</button>
      <button type="button" data-number="38">38</button>
      <button type="button" data-number="39">39</button>
    </section>
    <section class="amounts">
      <label>二星</label>
      <input data-amount-field="二星" inputmode="numeric" />
      <label>三星</label>
      <input data-amount-field="三星" inputmode="numeric" />
      <label>四星</label>
      <input data-amount-field="四星" inputmode="numeric" />
    </section>
    <section class="danger">
      <button type="button" data-danger="true">送出注單</button>
      <button type="button" data-danger="true">確認</button>
    </section>
    <script>
      document.querySelectorAll("[data-number]").forEach((button) => {
        button.addEventListener("click", () => {
          button.classList.add("selected");
          button.dataset.selected = "true";
        });
      });
      document.querySelectorAll("[data-danger]").forEach((button) => {
        button.addEventListener("click", () => {
          document.body.dataset.dangerClicked = "true";
        });
      });
    </script>
  </body>
</html>
